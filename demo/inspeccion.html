<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<title>Standard Job · Inspección</title>
<style>
  /* iOS agranda el texto dentro de las hojas reducidas con zoom y las filas se superponen. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  /* Tokens derivados de la familia SAP (awesome-design-md): lienzo blanco, bandas planas,
     un solo azul para lo interactivo, grises pizarra para texto. Ver docs/DESIGN.md */
  :root {
    --primary: #0057d2;
    --navy: #022879;
    --ink: #223548;
    --muted: #475e75;
    --line: #d5dadd;
    --head: #022879;
    --chrome: #f5f6f7;
    --band: #eaecee;
    --label-bg: #f5f6f7;
    --bn: #1d7a46;
    --ml: #bb0000;
    --nt: #6a6d70;
    --na: #8a6d00;
    --nr: #8a4b1d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #d9dde1; color: var(--ink);
    font: 9.5pt/1.3 "Public Sans", "Segoe UI", Arial, Helvetica, sans-serif; }

  /* ---------- Barra de iteración (no se imprime) ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line); font-size: 13px; }
  .toolbar strong { margin-right: 4px; }
  .toolbar select, .toolbar button { font: inherit; min-height: 34px; padding: 0 10px; border: 1px solid var(--line); background: #fff; border-radius: 4px; }
  .toolbar button { cursor: pointer; background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .toolbar button:hover { background: #0040b0; }
  .toolbar label { display: inline-flex; gap: 6px; align-items: center; }
  .toolbar .grow { flex: 1; }
  .toolbar small { color: var(--muted); }

  /* ---------- Hoja A4 ---------- */
  #pages { padding: 20px 0 40px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .sheet { position: relative; width: 210mm; height: 297mm; padding: 11mm 11mm 16mm; background: #fff;
    box-shadow: 0 2px 12px rgb(0 0 0 / 25%); overflow: hidden; transform-origin: top center; }
  .footer { position: absolute; left: 11mm; right: 11mm; bottom: 7mm; display: flex; justify-content: space-between;
    font-size: 7.5pt; color: var(--muted); }

  .title-box { display: grid; grid-template-columns: 1fr 1fr; background: var(--chrome); border-top: 5px solid var(--primary);
    border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .title-box > div { padding: 10px 14px; }
  .title-box > div + div { border-left: 1px solid var(--line); font-size: 8.5pt; display: grid; gap: 6px; align-content: center; color: var(--muted); }
  .title-box h1 { margin: 0 0 10px; font-size: 13pt; font-weight: 700; color: var(--navy); }
  .title-box h2 { margin: 0; font-size: 11.5pt; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; }
  .meta td { border: 1px solid var(--line); padding: 4px 8px; height: 20px; }
  .meta td.k { width: 20%; background: var(--label-bg); font-weight: 700; white-space: nowrap; }
  .meta td.v { width: 30%; }
  .meta { margin-bottom: 14px; }

  th { background: var(--head); color: #fff; text-align: left; font-size: 8.5pt; padding: 7px 8px; }
  .people { margin-bottom: 12px; }
  .people td { border: 1px solid var(--line); padding: 4px 8px; height: 44px; vertical-align: middle; }
  .people .sig svg { height: 38px; width: 110px; display: block; margin: 0 auto; }

  .nomen { font-size: 8pt; margin-bottom: 10px; }
  .nomen b { display: block; margin-bottom: 2px; font-size: 8.5pt; }

  .items td { border: 1px solid var(--line); padding: 3px 8px; vertical-align: middle; }
  .items td.n { width: 28px; text-align: center; }
  .items td.val { width: 64px; text-align: center; }
  .items td.st { width: 52px; text-align: center; padding: 0; }
  .items td.obs { width: 30%; }
  .items tr { height: 28px; }
  .badge { display: block; height: 100%; min-height: 28px; line-height: 28px; color: #fff; font-weight: 700; font-size: 8.5pt; }
  .badge.BN { background: var(--bn); } .badge.ML { background: var(--ml); } .badge.NT { background: var(--nt); }
  .badge.NA { background: var(--na); } .badge.NR { background: var(--nr); }
  .empty .badge { background: transparent; color: var(--muted); font-weight: 400; }
  .crit td.obs { color: var(--ml); font-weight: 700; }

  .section-title { margin: 16px 0 6px; padding: 5px 8px; background: var(--band); color: var(--navy); font-size: 9.5pt; font-weight: 700; text-transform: uppercase; }
  .diag { width: 100%; border: 1px solid var(--line); margin-bottom: 14px; }
  .diag .row { padding: 8px; min-height: 52px; }
  .diag .row + .row { border-top: 1px solid var(--line); }
  .diag .lbl { font-weight: 700; display: block; margin-bottom: 3px; }

  .sign td { border: 1px solid var(--line); padding: 8px; height: 46px; }
  .sign svg { height: 34px; width: 100px; }

  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .photo figure { margin: 0; }
  .photo .img { height: 215px; border: 1px solid var(--line); background: repeating-linear-gradient(45deg,#f2f4f5,#f2f4f5 10px,#e8ebed 10px,#e8ebed 20px);
    display: grid; place-items: center; color: var(--muted); font-size: 8pt; }
  .photo figcaption { margin-top: 4px; font-size: 8pt; }

  .tag-draft { color: var(--muted); font-style: italic; }

  /* ======================================================================
     Diseño «Cobre»: grafito + cobre (el mineral de Los Pelambres), números grandes
     tipo instrumento, lista agrupada con pastillas de estado. Alternativa al clásico.
     ====================================================================== */
  .sheet.v2 {
    --cu: #c4602d; --cu-soft: #f6e6dc; --graf: #14181d; --graf-2: #232a31; --paper: #f6f4f0;
    --txt: #14181d; --sub: #5b646d; --hair: #e1ddd5;
    padding: 0; color: var(--txt); font-family: "Geist", "Segoe UI", Arial, sans-serif; font-size: 9pt;
  }
  .v2 .pad { padding: 0 11mm; }
  .v2 .mono { font-family: "Geist Mono", ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .v2 .hero { background: var(--graf); color: #fff; padding: 8mm 11mm 7mm; border-bottom: 3px solid var(--cu); }
  .v2 .hero-top { display: flex; justify-content: space-between; font: 500 6.8pt "Geist Mono", monospace;
    letter-spacing: .08em; text-transform: uppercase; color: #9aa4ad; }
  .v2 .hero-top .chip { color: #fff; border: 1px solid #4a545e; padding: 1px 7px; border-radius: 99px; }
  .v2 .hero-main { display: grid; grid-template-columns: 1fr auto; gap: 14mm; align-items: end; margin-top: 7mm; }
  .v2 .kicker { color: var(--cu); font: 600 8pt "Geist", sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .v2 .tag { font-size: 38pt; line-height: 1; font-weight: 700; letter-spacing: -.02em; margin: 2mm 0 2mm; }
  .v2 .place { color: #c9d0d6; font-size: 10pt; }
  .v2 .hero-meta { display: grid; grid-template-columns: auto auto; gap: 2px 10px; font-size: 8pt; text-align: right; }
  .v2 .hero-meta dt { color: #8c97a1; text-align: right; margin: 0; }
  .v2 .hero-meta dd { margin: 0; font-weight: 600; text-align: left; }

  .v2 .specs { display: grid; grid-template-columns: repeat(3, 1fr); margin: 6mm 11mm 0; border-top: 1px solid var(--txt); }
  .v2 .spec { padding: 6px 0 7px; border-bottom: 1px solid var(--hair); }
  .v2 .spec:nth-child(3n+2), .v2 .spec:nth-child(3n) { padding-left: 14px; border-left: 1px solid var(--hair); }
  .v2 .lbl { font: 500 6.6pt "Geist Mono", monospace; letter-spacing: .07em; text-transform: uppercase; color: var(--sub); }
  .v2 .spec b { display: block; font-size: 11pt; font-weight: 600; margin-top: 1px; }

  .v2 .summary { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8mm; margin: 6mm 11mm 0; align-items: stretch; }
  .v2 .res .big { font-size: 20pt; font-weight: 700; letter-spacing: -.02em; }
  .v2 .res .big small { font-size: 9pt; font-weight: 500; color: var(--sub); letter-spacing: 0; margin-left: 4px; }
  .v2 .seg { display: flex; height: 8px; margin: 5px 0 5px; border-radius: 2px; overflow: hidden; background: var(--hair); }
  .v2 .seg i { display: block; height: 100%; }
  .v2 .legend { display: flex; gap: 12px; font-size: 7.5pt; color: var(--sub); }
  .v2 .legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; background: var(--c); }
  .v2 .alert { background: var(--cu-soft); border-left: 3px solid var(--cu); padding: 7px 10px; font-size: 8pt; }
  .v2 .alert b { display: block; color: var(--cu); font: 600 6.8pt "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
  .v2 .alert.ok { background: #e4f3ea; border-color: #1d7a46; }
  .v2 .alert.ok b { color: #1d7a46; }

  .v2 .gauges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 5mm 11mm 0; }
  .v2 .gauge { background: var(--paper); border: 1px solid var(--hair); padding: 7px 10px 8px; }
  .v2 .gauge.wide { grid-column: span 2; }
  .v2 .gauge .val { font-size: 19pt; font-weight: 600; letter-spacing: -.02em; margin-top: 1px; }
  .v2 .gauge .val small { font-size: 8.5pt; font-weight: 500; color: var(--sub); margin-left: 2px; }
  .v2 .track { position: relative; height: 5px; background: #e4e0d7; margin: 7px 0 3px; border-radius: 2px; }
  .v2 .track .fill { position: absolute; inset: 0 auto 0 0; background: var(--graf); border-radius: 2px; }
  .v2 .track .mark { position: absolute; top: -3px; width: 2px; height: 11px; background: var(--cu); }
  .v2 .track-note { display: flex; justify-content: space-between; font-size: 6.8pt; color: var(--sub); }

  .v2 .group { margin: 5mm 11mm 0; }
  .v2 .group-h { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--txt); padding-bottom: 3px; }
  .v2 .group-h h3 { margin: 0; font-size: 9.5pt; font-weight: 700; }
  .v2 .group-h span { font: 500 6.8pt "Geist Mono", monospace; color: var(--sub); letter-spacing: .06em; }
  .v2 .row { display: grid; grid-template-columns: 22px 1fr auto 38px; gap: 8px; align-items: center; padding: 3.2px 0; border-bottom: 1px solid var(--hair); min-height: 22px; }
  .v2 .row .n { font: 500 7.5pt "Geist Mono", monospace; color: var(--sub); }
  .v2 .row .v { font: 600 8.5pt "Geist Mono", monospace; text-align: right; min-width: 44px; }
  .v2 .row .obs { grid-column: 2 / 4; margin-top: -1px; padding: 3px 7px; background: var(--cu-soft); color: #8d3d14; font-size: 8pt; font-weight: 500; }
  .v2 .pill { display: inline-grid; place-items: center; width: 34px; height: 17px; border-radius: 99px; font: 600 7pt "Geist Mono", monospace; letter-spacing: .04em; }
  .v2 .pill.BN { background: #e1f2e8; color: #0b6b3a; }
  .v2 .pill.ML { background: #bb0000; color: #fff; }
  .v2 .pill.NT { background: #e9ebed; color: #4a525a; }
  .v2 .pill.NA { background: #f4ecce; color: #6e5700; }
  .v2 .pill.NR { background: #f3e1d3; color: #7a3d12; }
  .v2 .pill.empty { background: transparent; border: 1px dashed #b9b4a9; }
  .v2 .row.ml .t { font-weight: 600; }

  .v2 .note { margin: 5mm 11mm 0; font-size: 7pt; color: var(--sub); }
  .v2 .diag2 { margin: 5mm 11mm 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .v2 .diag2 div { min-height: 22mm; border: 1px solid var(--hair); background: var(--paper); padding: 7px 10px; }
  .v2 .sig-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 5mm 11mm 0; }
  .v2 .sig-card { border: 1px solid var(--hair); padding: 7px 9px 6px; min-height: 29mm; display: flex; flex-direction: column; }
  .v2 .sig-card .who { font-weight: 600; font-size: 8.5pt; margin-top: auto; }
  .v2 .sig-card svg { height: 28px; width: 90px; margin-top: 3px; }
  .v2 .sig-card .line { border-top: 1px solid var(--txt); margin-top: 4px; padding-top: 2px; font-size: 6.8pt; color: var(--sub); }
  .v2 .section-h { margin: 6mm 11mm 3mm; font-size: 14pt; font-weight: 700; letter-spacing: -.01em; }
  .v2 .photos { margin: 0 11mm; }
  .v2 .photo .img { border-radius: 2px; }
  .v2 .footer { color: var(--sub); font-family: "Geist Mono", monospace; letter-spacing: .03em; }

  /* Bordes redondeados (sistema: 14px tarjetas, 10px módulos, 6px detalles, píldoras 99px) */
  .v2 .hero { border-radius: 0 0 22px 22px; }
  .v2 .specs { border: 1px solid var(--hair); border-radius: 14px; padding: 2px 14px; background: #fff; }
  .v2 .spec:nth-last-child(-n+3) { border-bottom: 0; }
  .v2 .gauge { border-radius: 12px; }
  .v2 .track, .v2 .track .fill { border-radius: 99px; }
  .v2 .seg { border-radius: 99px; height: 9px; }
  .v2 .alert { border-radius: 12px; border-left-width: 0; border: 1px solid #ecc9b5; }
  .v2 .alert.ok { border-color: #bfe2cd; }
  .v2 .group { border: 1px solid var(--hair); border-radius: 14px; padding: 7px 12px 2px; }
  .v2 .group-h { border-bottom: 0; padding-bottom: 2px; }
  .v2 .row:last-of-type { border-bottom: 0; }
  .v2 .row .obs { border-radius: 8px; }
  .v2 .diag2 div { border-radius: 12px; }
  .v2 .sig-card { border-radius: 12px; }
  .v2 .photo .img { border-radius: 12px; }

  .v2 .brand { display: inline-flex; align-items: center; background: #fff; border-radius: 10px; padding: 5px 10px; }
  .v2 .brand img { height: 8.5mm; width: auto; display: block; }
  .v2 .hero-top { align-items: center; }
  .v2 .hero-top .meta-r { display: inline-flex; align-items: center; gap: 8px; }

  /* ---------- Impresión ---------- */
  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .toolbar { display: none; }
    #pages { padding: 0; gap: 0; display: block; }
    .sheet { box-shadow: none; page-break-after: always; zoom: 1 !important; transform: none !important; }
    .sheet:last-child { page-break-after: auto; }
  }


/* ======================================================================
   Formulario interactivo (editor a la izquierda, informe «Cobre» en vivo a la derecha)
   ====================================================================== */
body { font-family: "Geist", "Segoe UI", Arial, sans-serif; }
.toolbar { font-family: "Geist", "Segoe UI", Arial, sans-serif; }
.toolbar button.sec { background: #fff; color: var(--primary); }
.toolbar button.sec:hover { background: #eef4fd; }
.toolbar .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: #e1f2e8; color: #0b6b3a; }
.toolbar .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.toolbar .chip.off { background: #f3e1d3; color: #7a3d12; }
.vtab { display: none; }

#app { display: grid; grid-template-columns: minmax(380px, 470px) 1fr; align-items: start; }
#editor { position: sticky; top: 53px; height: calc(100vh - 53px); overflow: auto; background: #f6f4f0; border-right: 1px solid #e1ddd5;
  padding: 14px; font-size: 16px; color: #14181d; }
#pages { min-width: 0; }

.ed-card { background: #fff; border: 1px solid #e1ddd5; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.ed-card > h2, .ed-group-h h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.ed-group-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.ed-group-h h2 { margin: 0; }
.ed-group-h button { min-height: 36px; padding: 0 12px; border-radius: 99px; border: 1.5px solid #c4602d; background: #fff; color: #9a4519; font: 600 13px "Geist", sans-serif; cursor: pointer; }
.ed-group-h button:hover { background: #f6e6dc; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; }
.fld.full { grid-column: 1 / -1; }
.fld > span, .lbl2 { font: 500 11px "Geist Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #5b646d; }
.fld input, .fld select, .fld textarea, .item textarea, .val input {
  width: 100%; min-height: 48px; padding: 10px 12px; border: 1.5px solid #cfcac0; border-radius: 12px; background: #fff;
  font: 500 16px "Geist", sans-serif; color: #14181d; }
.fld textarea, .item textarea { min-height: 64px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus, .item textarea:focus, .val input:focus {
  outline: 3px solid rgb(196 96 45 / 35%); outline-offset: 1px; border-color: #c4602d; }

.item { background: #fff; border: 1.5px solid #e1ddd5; border-radius: 16px; padding: 12px; margin-bottom: 10px; scroll-margin-top: 12px; }
.item.bad { border-color: #bb0000; box-shadow: 0 0 0 3px rgb(187 0 0 / 12%); }
.item-h { display: flex; gap: 10px; align-items: flex-start; }
.item-h .n { flex: none; font: 600 12px "Geist Mono", monospace; background: #14181d; color: #fff; border-radius: 99px; padding: 3px 8px; margin-top: 1px; }
.item-h p { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 500; }
.states { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
.states button { min-height: 52px; border-radius: 12px; border: 1.5px solid #cfcac0; background: #fff; color: #14181d; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-family: "Geist", sans-serif; }
.states button b { font: 700 15px "Geist Mono", monospace; }
.states button small { font-size: 10px; color: #5b646d; }
.states button:hover { border-color: #14181d; }
.states button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.states button[aria-pressed="true"] small { color: #fff; opacity: .9; }
.states button[data-e="BN"][aria-pressed="true"] { background: #1d7a46; }
.states button[data-e="ML"][aria-pressed="true"] { background: #bb0000; }
.states button[data-e="NT"][aria-pressed="true"] { background: #6a6d70; }
.states button[data-e="NA"][aria-pressed="true"] { background: #8a6d00; }
.states button[data-e="NR"][aria-pressed="true"] { background: #8a4b1d; }
.states button:focus-visible { outline: 3px solid rgb(196 96 45 / 55%); outline-offset: 2px; }
.val { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.val label { font: 500 11px "Geist Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: #5b646d; }
.val input { max-width: 140px; font-family: "Geist Mono", monospace; text-align: right; }
.val .u { font: 600 15px "Geist Mono", monospace; color: #5b646d; }
.item textarea { margin-top: 10px; }
.fotos { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.addfoto { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 16px; border: 1.5px dashed #9a9488; border-radius: 12px;
  background: #faf8f4; color: #14181d; font: 600 14px "Geist", sans-serif; cursor: pointer; }
.addfoto:hover { border-color: #c4602d; background: #f6e6dc; }
.thumb { position: relative; width: 52px; height: 52px; border-radius: 10px; overflow: hidden; border: 1px solid #e1ddd5; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgb(20 24 29 / 80%); color: #fff; font-size: 12px; line-height: 1; cursor: pointer; }
.aviso { margin: 8px 0 0; padding: 6px 10px; border-radius: 10px; background: #f6e6dc; color: #8d3d14; font-size: 13px; font-weight: 500; }

.pad { display: block; width: 100%; height: 150px; border: 1.5px dashed #9a9488; border-radius: 14px; background: #fff; touch-action: none; cursor: crosshair; }
.pad-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; color: #5b646d; }
.pad-bar button { min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1.5px solid #cfcac0; background: #fff; font: 600 13px "Geist", sans-serif; cursor: pointer; }

.errores, .bloqueo { border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
.errores { background: #fdecec; border: 1.5px solid #bb0000; color: #7a0000; }
.errores h3 { margin: 0 0 6px; font-size: 15px; }
.errores ul { margin: 0; padding-left: 18px; }
.errores a { color: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
.bloqueo { background: #e1f2e8; border: 1.5px solid #1d7a46; color: #0b4a28; }
.bloqueo button { margin-top: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #14181d; color: #fff; font: 600 14px "Geist", sans-serif; cursor: pointer; }
#editor[inert] .ed-card, #editor[inert] .item { opacity: .6; }

#toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .25s; z-index: 20;
  background: #14181d; color: #fff; padding: 10px 18px; border-radius: 99px; font: 500 14px "Geist", sans-serif; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

.v2.cont { padding-top: 10mm; }
.v2 .photo img { width: 100%; height: 215px; object-fit: cover; border-radius: 12px; display: block; border: 1px solid var(--hair); }

.v2 .sig-card img { height: 40px; max-width: 100%; object-fit: contain; object-position: left; margin-top: 3px; }

@media (max-width: 1000px) {
  .toolbar { position: static; }
  #app { display: block; }
  #editor { position: static; height: auto; border-right: 0; }
  #app[data-view="form"] #pages { display: none; }
  #app[data-view="report"] #editor { display: none; }
  .vtab { display: inline-block; }
  .vtab[aria-pressed="true"] { background: #14181d; border-color: #14181d; color: #fff; }
}
@media (max-width: 480px) {
  .grid2 { grid-template-columns: 1fr; }
  .states button small { font-size: 9px; }
}
@media print {
  #editor, #toast { display: none !important; }
  #app { display: block !important; }
  #app[data-view="form"] #pages { display: block !important; }
}
.val select { min-height: 48px; min-width: 160px; padding: 10px 12px; border: 1.5px solid #cfcac0; border-radius: 12px; background: #fff; font: 500 16px "Geist", sans-serif; color: #14181d; }
.val select:focus { outline: 3px solid rgb(196 96 45 / 35%); outline-offset: 1px; border-color: #c4602d; }

/* ======================================================================
   Motor común para inspecciones de un equipo. Cada formato se define en
   formatos/<id>.js (window.FORMATO) y se abre con inspeccion.html?f=<id>.
   ====================================================================== */
const $ = (q, r = document) => r.querySelector(q);
const $$ = (q, r = document) => [...r.querySelectorAll(q)];
const EQ = window.FORMATO;
if (!EQ) {
  document.body.innerHTML = `<main style="max-width:460px;margin:15vh auto;padding:0 16px;font:16px system-ui,sans-serif">
    <h1>Formulario no encontrado</h1><p>Vuelva al <a href="inspecciones.html">menú de inspecciones</a>.</p></main>`;
  throw new Error("Formato no encontrado");
}
EQ.items = EQ.items.map((it) => (typeof it === "string" ? { t: it } : it));
const NOMENCLATURA = EQ.nomenclatura ||
  "NT: No tiene / BN: Bueno / ML: Malo / NA: No aplica / NR: No realizada (indicar motivos en observaciones). " +
  "En caso de observaciones críticas, se adjunta registro fotográfico con la referencia.";
const REQUERIDOS = EQ.requeridos ||
  [["tag", "TAG del equipo"], ["ot", "N° OT"], ["ubicacion", "Ubicación"], ["fecha", "Fecha"], ["h_inicio", "Hora de inicio"], ["h_fin", "Hora de término"]];
const SPECS = EQ.specs || [
  ["Ubicación", (c) => c.ubicacion], ["N° OT", (c) => c.ot], ["Participantes", (c, s) => s.participantes],
  ...EQ.roles.map((r) => [r, (c, s) => s.roles[r]]),
];
const ESTADOS = [["BN", "Bueno"], ["ML", "Malo"], ["NT", "No tiene"], ["NA", "No aplica"], ["NR", "No realizada"]];
const N_ITEMS = EQ.items.length;
document.title = `Standard Job · ${EQ.titulo}`;
$("#titulo").textContent = EQ.nombre;

/* ======================================================================
   Estado (se guarda como borrador en este navegador, como haría la app offline)
   ====================================================================== */
const KEY = EQ.clave || "mlp-form-" + EQ.id;
const vacio = () => ({
  cab: {}, participantes: "", firmaPart: null, roles: {}, obsGeneral: "", consideraciones: "",
  filas: {}, enviado: false, folio: null, generado: null,
});
let S = vacio();
try { const raw = localStorage.getItem(KEY); if (raw) S = { ...vacio(), ...JSON.parse(raw) }; } catch { /* sin almacenamiento */ }

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (s) => parseFloat(String(s ?? "").replace(",", "."));
const fila = (n) => (S.filas[n] ||= {});
const fechaCL = (iso) => (iso ? iso.split("-").reverse().join("-") : "");
const mmPx = (mm) => (mm * 96) / 25.4;

let guardadoTimer;
function guardar() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); $("#estado").textContent = "Borrador guardado " + new Date().toLocaleTimeString("es-CL", { timeZone: "America/Santiago" }); }
  catch { $("#estado").textContent = "No se pudo guardar el borrador en este navegador"; }
  clearTimeout(guardadoTimer);
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ======================================================================
   Editor
   ====================================================================== */
function campoHtml([k, label, tipo, lista]) {
  const v = esc(S.cab[k] ?? "");
  const dl = lista ? ` list="dl_${k}"` : "";
  const extra = tipo === "number" ? ' inputmode="decimal"' : "";
  return `<label class="fld"><span>${esc(label)}</span><input data-cab="${k}" type="${tipo === "number" ? "text" : tipo}"${extra}${dl} value="${v}" autocomplete="off">
    ${lista ? `<datalist id="dl_${k}">${lista.map((o) => `<option value="${o}">`).join("")}</datalist>` : ""}</label>`;
}

function itemHtml(n) {
  const it = EQ.items[n - 1], f = S.filas[n] || {};
  const estados = ESTADOS.map(([e, w]) => `<button type="button" data-e="${e}" aria-pressed="${f.e === e}"><b>${e}</b><small>${w}</small></button>`).join("");
  const valor = it.opc
    ? `<div class="val"><label for="v${n}">Valor</label><select id="v${n}" data-k="v"><option value="">—</option>${it.opc.map((o) => `<option${f.v === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`
    : it.unit === undefined ? "" : `<div class="val"><label for="v${n}">Valor</label>
    <input id="v${n}" data-k="v" inputmode="decimal" value="${esc(f.v ?? "")}" autocomplete="off"><span class="u">${esc(it.unit)}</span></div>`;
  return `<article class="item" id="item-${n}" data-n="${n}">
    <div class="item-h"><span class="n">${String(n).padStart(2, "0")}</span><p>${esc(it.t)}</p></div>
    <div class="states" role="group" aria-label="Estado del ítem ${n}">${estados}</div>
    ${valor}
    <textarea data-k="obs" rows="2" placeholder="Observación (obligatoria si es ML o NR)">${esc(f.obs ?? "")}</textarea>
    <div class="fotos"><label class="addfoto">＋ Foto<input type="file" accept="image/*" capture="environment" hidden data-foto></label><span class="thumbs"></span></div>
    <p class="aviso" hidden></p></article>`;
}

function buildEditor() {
  const roles = EQ.roles.map((r) => `<label class="fld"><span>${esc(r)}</span><input data-rol="${esc(r)}" value="${esc(S.roles[r] ?? "")}" autocomplete="off"></label>`).join("");
  $("#editor").innerHTML = `
    <div class="errores" id="errores" hidden></div>
    <div class="bloqueo" id="bloqueo" hidden></div>
    <section class="ed-card"><h2>Datos del equipo</h2><div class="grid2">${EQ.cabecera.map(campoHtml).join("")}</div></section>
    ${EQ.grupos.map((g, gi) => `<section class="ed-group" data-g="${gi}">
      <div class="ed-group-h"><h2>${esc(g.t)}</h2><button type="button" data-todo-bn="${gi}">Pendientes → BN</button></div>
      ${Array.from({ length: g.hasta - g.desde + 1 }, (_, k) => itemHtml(g.desde + k)).join("")}</section>`).join("")}
    <section class="ed-card"><h2>Diagnóstico final</h2><div class="grid2">
      <label class="fld full"><span>Observaciones generales</span><textarea data-diag="obsGeneral" rows="3">${esc(S.obsGeneral)}</textarea></label>
      ${EQ.consideraciones ? `<label class="fld full"><span>Consideraciones</span><textarea data-diag="consideraciones" rows="3">${esc(S.consideraciones)}</textarea></label>` : ""}</div></section>
    <section class="ed-card"><h2>Participantes y firmas</h2>
      <label class="fld"><span>Participantes (separados por coma)</span><input data-part value="${esc(S.participantes)}" autocomplete="off"></label>
      <p class="lbl2" style="margin:12px 0 6px">Firma del participante</p>
      <canvas class="pad" id="pad" aria-label="Firma"></canvas>
      <div class="pad-bar"><span>Firme con el dedo o el mouse</span><button type="button" id="padClear">Limpiar</button></div>
      <div class="grid2" style="margin-top:14px">${roles}</div></section>`;
  $$(".item").forEach((el) => pintaItem(+el.dataset.n));
  initPad();
}

function pintaItem(n) {
  const el = $("#item-" + n), f = S.filas[n] || {};
  $$(".states button", el).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.e === f.e)));
  $(".thumbs", el).innerHTML = (f.fotos || []).map((src, i) => `<span class="thumb"><img src="${src}" alt="Foto ${i + 1}"><button type="button" data-delfoto="${i}" aria-label="Quitar foto">×</button></span>`).join("");
  const av = $(".aviso", el), faltas = faltasItem(n);
  av.hidden = !faltas.length;
  av.textContent = faltas.join(" · ");
  el.classList.remove("bad");
}

/* Reglas del formulario: ML exige observación; NR exige motivo. La foto es opcional. */
function faltasItem(n) {
  const f = S.filas[n] || {}, out = [];
  if (f.e === "ML" && !(f.obs || "").trim()) out.push("Falta observación");
  if (f.e === "NR" && !(f.obs || "").trim()) out.push("Indique el motivo en observaciones");
  return out;
}

/* ---- Firma dibujada ---- */
function initPad() {
  const cv = $("#pad"); if (!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight; if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#14181d";
  if (S.firmaPart) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, w, h); im.src = S.firmaPart; }
  if (cv._ok) return; cv._ok = true;
  let dibujando = false, hay = false;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", (e) => { dibujando = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + .01, y + .01); ctx.stroke(); hay = true; });
  cv.addEventListener("pointermove", (e) => { if (!dibujando) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); });
  const fin = () => { if (!dibujando) return; dibujando = false; if (hay) { S.firmaPart = cv.toDataURL("image/png"); persistir(); } };
  cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", fin);
  $("#padClear").addEventListener("click", () => { ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight); S.firmaPart = null; hay = false; persistir(); });
}

/* ---- Fotos: se comprimen en el cliente (máx. 1280 px, JPEG 0,72) ---- */
async function comprimir(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  return cv.toDataURL("image/jpeg", 0.72);
}

/* ---- Eventos del editor ---- */
const ed = $("#editor");
ed.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const item = e.target.closest(".item");
  if (b.dataset.e && item) {
    const n = +item.dataset.n, f = fila(n);
    f.e = f.e === b.dataset.e ? undefined : b.dataset.e;
    pintaItem(n); persistir();
  } else if (b.dataset.delfoto !== undefined && item) {
    const n = +item.dataset.n; fila(n).fotos.splice(+b.dataset.delfoto, 1); pintaItem(n); persistir();
  } else if (b.dataset.todoBn !== undefined) {
    const g = EQ.grupos[+b.dataset.todoBn];
    for (let n = g.desde; n <= g.hasta; n++) if (!fila(n).e) { fila(n).e = "BN"; pintaItem(n); }
    persistir();
  }
});
ed.addEventListener("input", (e) => {
  const t = e.target, item = t.closest(".item");
  if (item && t.dataset.k) { const n = +item.dataset.n; fila(n)[t.dataset.k] = t.value; pintaItem(n); }
  else if (t.dataset.cab) S.cab[t.dataset.cab] = t.value;
  else if (t.dataset.rol) S.roles[t.dataset.rol] = t.value;
  else if (t.dataset.diag) S[t.dataset.diag] = t.value;
  else if (t.dataset.part !== undefined) S.participantes = t.value;
  else return;
  persistir();
});
ed.addEventListener("change", async (e) => {
  const t = e.target; if (!t.matches("[data-foto]")) return;
  const n = +t.closest(".item").dataset.n, f = fila(n); f.fotos ||= [];
  for (const file of [...t.files].slice(0, 3 - f.fotos.length)) {
    try { f.fotos.push(await comprimir(file)); } catch { toast("No se pudo leer la imagen"); }
  }
  t.value = ""; pintaItem(n); persistir();
});

/* ======================================================================
   Informe «Cobre» en vivo
   ====================================================================== */
const estadoDe = (n) => (S.filas[n] && S.filas[n].e) || "";
const valorTxt = (n) => { const f = S.filas[n] || {}, u = EQ.items[n - 1].unit; return f.v ? `${f.v}${u ? " " + u : ""}` : ""; };

const bHero = () => {
  const c = S.cab, v = (k) => esc(c[k]) || "—";
  return `<div><header class="hero">
    <div class="hero-top"><span class="brand"><img src="${LOGO_SRC}" alt="BBOSCH, Infraestructura para el futuro"></span><span class="meta-r"><span>${esc(EQ.norma)} · Rev. ${esc(EQ.revision)}</span><span class="chip">${S.enviado ? "Completa" : "Borrador"}</span></span></div>
    <div class="hero-main"><div><div class="kicker">${esc(EQ.titulo)}</div><div class="tag mono">${v("tag")}</div><div class="place">${v("ubicacion")}</div></div>
      <dl class="hero-meta"><dt>N° OT</dt><dd class="mono">${v("ot")}</dd><dt>Fecha</dt><dd class="mono">${esc(fechaCL(c.fecha)) || "—"}</dd>
        <dt>Horario</dt><dd class="mono">${c.h_inicio || c.h_fin ? `${esc(c.h_inicio) || "—"} – ${esc(c.h_fin) || "—"}` : "—"}</dd></dl></div></header>
    <div class="specs">${SPECS.map(([l, fn]) => `<div class="spec"><span class="lbl">${esc(l)}</span><b class="mono">${esc(fn(c, S)) || "—"}</b></div>`).join("")}</div></div>`;
};

const bResumen = () => {
  const cuenta = { BN: 0, ML: 0, NT: 0, NA: 0, NR: 0 };
  for (let n = 1; n <= N_ITEMS; n++) if (estadoDe(n)) cuenta[estadoDe(n)]++;
  const marc = Object.values(cuenta).reduce((a, b) => a + b, 0), pend = N_ITEMS - marc;
  const col = { BN: "#1d7a46", ML: "#bb0000", NT: "#9aa1a8", NA: "#c9a227", NR: "#b8651b" };
  const seg = Object.keys(cuenta).filter((k) => cuenta[k]).map((k) => `<i style="width:${(cuenta[k] / N_ITEMS) * 100}%;background:${col[k]}"></i>`).join("");
  const leg = Object.keys(cuenta).filter((k) => cuenta[k]).map((k) => `<span style="--c:${col[k]}">${k} ${cuenta[k]}</span>`).join("") + (pend ? `<span style="--c:#d9d4c9">Pendientes ${pend}</span>` : "");
  const ml = []; for (let n = 1; n <= N_ITEMS; n++) if (estadoDe(n) === "ML") ml.push(n);
  const alerta = ml.length
    ? `<div class="alert"><b>${ml.length} observación${ml.length > 1 ? "es" : ""} crítica${ml.length > 1 ? "s" : ""}</b>Ítem ${ml.join(", ")} · ${esc((S.filas[ml[0]].obs || EQ.items[ml[0] - 1].t))}</div>`
    : pend ? `<div class="alert" style="background:#f1f0ec;border-color:#dcd8cd"><b style="color:#5b646d">En curso</b>Faltan ${pend} ítems por marcar.</div>`
    : `<div class="alert ok"><b>Sin observaciones críticas</b>Todos los ítems realizados quedaron conformes.</div>`;
  return `<div class="summary"><div class="res"><span class="lbl">Resultado de la inspección</span>
    <div class="big mono">${cuenta.BN}<small>de ${N_ITEMS} ítems en buen estado</small></div><div class="seg">${seg}</div><div class="legend">${leg}</div></div>${alerta}</div>`;
};

/* Lecturas destacadas: opcionales según el formato. */
const bLecturas = () => {
  if (!EQ.lecturas) return null;
  const val = (n) => num(S.filas[n] && S.filas[n].v);
  const ancha = (g) => {
    const a = val(g.act), m = val(g.max), pct = (x) => (Number.isFinite(x) ? Math.max(0, Math.min(100, (x / g.limite) * 100)) : 0);
    return `<div class="gauge wide"><span class="lbl">${esc(g.t)}</span><div class="val mono">${Number.isFinite(a) ? a : "—"}<small>${g.unit}</small></div>
      <div class="track"><div class="fill" style="width:${pct(a)}%"></div>${Number.isFinite(m) ? `<div class="mark" style="left:calc(${pct(m)}% - 1px)"></div>` : ""}</div>
      <div class="track-note"><span>Actual</span><span>Máx. registrada ${Number.isFinite(m) ? m + " " + g.unit : "—"} · límite ${g.limite} ${g.unit}</span></div></div>`;
  };
  const chica = (g) => { const x = val(g.i); return `<div class="gauge"><span class="lbl">${esc(g.t)}</span><div class="val mono">${Number.isFinite(x) ? x : "—"}<small>${g.unit}</small></div></div>`; };
  return `<div class="gauges">${(EQ.lecturas.anchas || []).map(ancha).join("")}${(EQ.lecturas.chicas || []).map(chica).join("")}</div>`;
};

const bGrupo = (g) => {
  let ok = 0, filas = "";
  for (let n = g.desde; n <= g.hasta; n++) {
    const f = S.filas[n] || {}, e = estadoDe(n); if (e === "BN") ok++;
    const nf = (f.fotos || []).length;
    const obs = [f.obs, nf ? `[Ver foto(s) punto ${n}]` : ""].filter(Boolean).join(" ");
    filas += `<div class="row ${e === "ML" ? "ml" : ""}"><span class="n">${String(n).padStart(2, "0")}</span><span class="t">${esc(EQ.items[n - 1].t)}</span>
      <span class="v">${esc(valorTxt(n))}</span><span class="pill ${e || "empty"}">${e}</span>${obs ? `<div class="obs">${esc(obs)}</div>` : ""}</div>`;
  }
  return `<section class="group"><div class="group-h"><h3>${esc(g.t)}</h3><span>${ok}/${g.hasta - g.desde + 1} BN</span></div>${filas}</section>`;
};

const bDiag = () => `<div><div class="note">${esc(NOMENCLATURA)}</div>
  <div class="diag2"${EQ.consideraciones ? "" : ' style="grid-template-columns:1fr"'}><div><span class="lbl">Observaciones generales</span><p>${esc(S.obsGeneral)}</p></div>${EQ.consideraciones ? `<div><span class="lbl">Consideraciones</span><p>${esc(S.consideraciones)}</p></div>` : ""}</div></div>`;

const bFirmas = () => {
  const tarjeta = (rol, nombre, firma) => `<div class="sig-card"><span class="lbl">${esc(rol)}</span>${firma ? `<img src="${firma}" alt="Firma">` : ""}
    <div class="who">${esc(nombre) || "&nbsp;"}</div><div class="line">Firma · Fecha recepción</div></div>`;
  return `<div class="sig-grid">${tarjeta("Participantes", S.participantes, S.firmaPart)}${EQ.roles.map((r) => tarjeta(r, S.roles[r], null)).join("")}</div>`;
};

const bFotos = () => {
  const todas = []; for (let n = 1; n <= N_ITEMS; n++) ((S.filas[n] || {}).fotos || []).forEach((src) => todas.push({ n, src }));
  if (!todas.length) return [];
  const bloques = [`<div class="section-h">Registro fotográfico</div>`];
  for (let i = 0; i < todas.length; i += 2) {
    bloques.push(`<div class="photos" style="margin-bottom:6mm">${todas.slice(i, i + 2).map(({ n, src }) => `<div class="photo"><figure>
      <img src="${src}" alt=""><figcaption>Punto ${n}: ${esc(EQ.items[n - 1].t)}</figcaption></figure></div>`).join("")}</div>`);
  }
  return bloques;
};

/* Paginación automática: cada bloque se agrega a la hoja y, si no cabe, pasa a una hoja nueva. */
let reportePendiente = false;
function renderReporte() {
  const host = $("#pages");
  if (host.offsetParent === null) { reportePendiente = true; return; }
  reportePendiente = false;
  const scroll = window.scrollY;
  host.innerHTML = "";
  const nueva = (cont) => {
    const s = document.createElement("section");
    s.className = "sheet v2" + (cont ? " cont" : "");
    s.innerHTML = `<div class="footer"><span class="pf"></span><span class="pg"></span></div>`;
    host.append(s); return s;
  };
  const bloques = [bHero(), bResumen(), bLecturas(), ...EQ.grupos.map(bGrupo), bDiag(), bFirmas(), ...bFotos()].filter(Boolean);
  let hoja = nueva(false);
  for (const html of bloques) {
    const tmp = document.createElement("div"); tmp.innerHTML = html;
    const nodo = tmp.firstElementChild, pie = $(".footer", hoja);
    hoja.insertBefore(nodo, pie);
    const lleno = nodo.getBoundingClientRect().bottom > hoja.getBoundingClientRect().bottom - mmPx(15);
    if (lleno && hoja.children.length > 2) { hoja.removeChild(nodo); hoja = nueva(true); hoja.insertBefore(nodo, $(".footer", hoja)); }
  }
  const hojas = $$(".sheet", host), gen = S.enviado ? `Generado digitalmente ${S.generado}` : "Borrador";
  hojas.forEach((h, i) => {
    $(".pf", h).textContent = `${EQ.norma}${S.cab.tag ? " · " + S.cab.tag : ""} · ${gen}${S.folio ? " · " + S.folio : ""}`;
    $(".pg", h).textContent = `Página ${i + 1} de ${hojas.length}`;
  });
  ajustaZoom(); window.scrollTo(0, scroll);
}
function ajustaZoom() {
  const ancho = mmPx(210), z = Math.min(1, ($("#pages").clientWidth - 16) / ancho);
  $$(".sheet").forEach((s) => (s.style.zoom = z));
}

let raf;
function persistir() {
  guardar(); progreso();
  cancelAnimationFrame(raf); raf = requestAnimationFrame(renderReporte);
}
function progreso() {
  let m = 0; for (let n = 1; n <= N_ITEMS; n++) if (estadoDe(n)) m++;
  $("#enviar").textContent = `Enviar inspección (${m}/${N_ITEMS})`;
}

/* ======================================================================
   Envío simulado: valida reglas y bloquea el registro (inmutable tras enviar)
   ====================================================================== */
function validar() {
  const er = [], c = S.cab;
  REQUERIDOS.forEach(([k, l]) => { if (!(c[k] || "").trim()) er.push({ t: `Falta ${l}`, ancla: null }); });
  const pend = []; for (let n = 1; n <= N_ITEMS; n++) if (!estadoDe(n)) pend.push(n);
  if (pend.length) er.push({ t: `${pend.length} ítems sin marcar (primero: ${pend[0]})`, ancla: "item-" + pend[0] });
  for (let n = 1; n <= N_ITEMS; n++) faltasItem(n).forEach((t) => er.push({ t: `Ítem ${n}: ${t}`, ancla: "item-" + n }));
  if (!(S.participantes || "").trim()) er.push({ t: "Falta el nombre de los participantes", ancla: null });
  if (!S.firmaPart) er.push({ t: "Falta la firma del participante", ancla: "pad" });
  return er;
}
function enviar() {
  const er = validar(), box = $("#errores");
  if (er.length) {
    box.hidden = false;
    box.innerHTML = `<h3>No se puede enviar todavía (${er.length})</h3><ul>${er.slice(0, 12).map((e) => `<li>${e.ancla ? `<a data-ir="${e.ancla}">${esc(e.t)}</a>` : esc(e.t)}</li>`).join("")}${er.length > 12 ? `<li>… y ${er.length - 12} más</li>` : ""}</ul>`;
    er.forEach((e) => e.ancla && e.ancla.startsWith("item-") && $("#" + e.ancla)?.classList.add("bad"));
    setView("form"); ed.scrollTo({ top: 0, behavior: "smooth" }); window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  let n = 1;
  try { n = (Number(localStorage.getItem(KEY + "-folio")) || 0) + 1; localStorage.setItem(KEY + "-folio", String(n)); } catch { /* sin almacenamiento: folio 1 */ }
  S.enviado = true; S.folio = `INS-${new Date().getFullYear()}-${String(n).padStart(6, "0")}`;
  S.generado = new Date().toLocaleString("es-CL", { timeZone: "America/Santiago" });
  bloquear(); persistir();
  toast(`Enviada · folio ${S.folio} (simulado)`);
}
function bloquear() {
  const b = $("#bloqueo"), e = $("#errores"); e.hidden = true;
  if (!S.enviado) { b.hidden = true; ed.inert = false; return; }
  b.hidden = false;
  b.innerHTML = `<b>Inspección enviada · ${esc(S.folio)}</b><br>El registro quedó de solo lectura, como ocurrirá tras la firma del supervisor. <br><button type="button" id="nueva">Nueva inspección</button>`;
  ed.inert = true; $("#nueva").inert = false;
  $("#enviar").disabled = true;
}
ed.addEventListener("click", (e) => {
  const a = e.target.closest("[data-ir]"); if (a) { $("#" + a.dataset.ir)?.scrollIntoView({ behavior: "smooth", block: "center" }); }
});

/* ======================================================================
   Barra superior
   ====================================================================== */
function reiniciar(nuevo) {
  S = nuevo; $("#enviar").disabled = false; ed.inert = false;
  buildEditor(); bloquear(); persistir();
}
$("#borrar").addEventListener("click", () => { if (confirm("¿Borrar todo el formulario?")) reiniciar(vacio()); });
$("#enviar").addEventListener("click", enviar);
$("#imprimir").addEventListener("click", () => { setView("report"); setTimeout(() => window.print(), 150); });
window.addEventListener("afterprint", () => setView("form"));
document.addEventListener("click", (e) => { if (e.target.id === "nueva") reiniciar(vacio()); });

function setView(v) {
  $("#app").dataset.view = v;
  if (v === "report") renderReporte(); else initPad();
}

function conexion() { const on = navigator.onLine; $("#conn").textContent = on ? "En línea" : "Sin conexión · borrador local"; $("#conn").classList.toggle("off", !on); }
addEventListener("online", conexion); addEventListener("offline", conexion); conexion();
addEventListener("resize", () => { ajustaZoom(); if (reportePendiente) renderReporte(); initPad(); });

buildEditor(); bloquear(); progreso(); renderReporte();
</script>
</body>
</html>
