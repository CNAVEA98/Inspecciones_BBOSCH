<!doctype html>
<html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standard Job · Inspecciones</title>
<style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;background:#f6f4f0;font:16px/1.4 system-ui,"Segoe UI",Arial,sans-serif;color:#14181d}
main{width:min(92vw,460px);margin:0 auto;padding:32px 0 48px;display:grid;gap:12px}
.volver{justify-self:start;color:#5b646d;text-decoration:none;font-weight:600;padding:8px 0}
.logo{display:block;width:140px;height:auto;margin:4px 0 16px;padding:10px 14px;background:#fff;border-radius:14px}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}p{margin:0 0 8px;color:#5b646d}
.op{display:block;padding:18px 20px;border-radius:16px;background:#14181d;color:#fff;text-decoration:none;font-weight:600;min-height:56px}
.op.off{background:#fff;color:#14181d;border:1.5px solid #14181d;opacity:.55;cursor:default}
small{display:block;font-weight:400;opacity:.8;margin-top:2px}</style></head>
<body><main>
<a class="volver" href="index.html">← Volver</a>
<img class="logo" src="brand/bbosch-logo.png" alt="BBOSCH" width="1115" height="391">
<h1>Formularios Inspecciones</h1><p>Seleccione el tipo de inspección a realizar.</p>
<div id="lista"></div>
</main>
<script>
// Tipos de inspección. Los de un equipo usan el motor común: inspeccion.html?f=<id> con formatos/<id>.js.
const TIPOS = [
  { nombre: "Insp. Transformador de Piso", href: "inspeccion.html?f=transformador-piso" },
  { nombre: "Insp. Transformador Aéreo" },
  { nombre: "Insp. Reconectador" },
  { nombre: "Insp. Grupo Generador" },
  { nombre: "Insp. Grupo de qjfcbaslkjcnsa" },
  { nombre: "Insp. Parrón de Maniobras" },
  { nombre: "Insp. Banco Batería" },
  { nombre: "Insp. Prueba de Grupos Generadores Principales y Auxiliares Chacay-Mina", href: "formulario-grupo-generador.html" },
  { nombre: "Insp. Desconectador / Seccionador de Maniobra 23 kV", href: "inspeccion.html?f=desconectador-23kv" },
  { nombre: "Insp. Banco de Condensadores Mauro", href: "inspeccion.html?f=banco-condensadores-mauro" },
];
document.getElementById("lista").outerHTML = TIPOS.map((t) => t.href
  ? `<a class="op" href="${t.href}">${t.nombre}<small>Completar formulario</small></a>`
  : `<div class="op off" aria-disabled="true">${t.nombre}<small>Próximamente</small></div>`).join("");
</script></body></html>
